name: Scrape water rate

on:
  schedule:
    # 3시간마다 실행 (UTC 기준: 0, 3, 6, 9, 12, 15, 18, 21시)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

permissions:
  contents: write # 깃허브 저장소에 commit & push 권한 부여

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install requests beautifulsoup4

      - name: 크롤링 실행
        run: |
          python crawler.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          #git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # 변경사항이 있을 때만 커밋 수행
          git commit -m "chore: 동복댐 저수율 데이터 업데이트 [skip ci]"
          git push
          echo "저수율 업데이트 완료"
